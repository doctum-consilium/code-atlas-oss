[project]
name = "code-atlas"
version = "1.0.0"
license = "Apache-2.0"
description = "Hybrid search (words + meaning) and questions over your own code repositories, on your machine"
requires-python = ">=3.11,<3.12"
dependencies = [
  "detect-secrets>=1.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyjwt[crypto]>=2.9,<3",
  "tree-sitter>=0.23,<1",
  "tree-sitter-language-pack>=0.6,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# Real models (embedder, reranker) on the local GPU. The CI uses deterministic fakes and
# never downloads PyTorch or CUDA.
gpu = ["sentence-transformers>=3.3,<6"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas", "atlas.chunking"]

[tool.setuptools.package-data]
atlas = ["sql/*.sql"]

[dependency-groups]
dev = [
  "bandit>=1.7,<2",
  "diff-cover>=9,<11",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "PL", "C4", "BLE"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity bounds: human review
  "RUF001", "RUF002", "RUF003",                            # typography in French prompts (’ « »)
  "S603", "S607",                                          # git and gh are called without a shell
  "PLR0917",                                               # positional arguments: human review
  "PLC0415",                                               # deliberate late imports (heavy models)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"atlas/config.py" = ["S105"]  # file NAMES of secrets, not values

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["atlas"]

[[tool.mypy.overrides]]
module = ["detect_secrets.*", "sentence_transformers.*", "tree_sitter_language_pack.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a ParadeDB database (CODE_ATLAS_TEST_DSN)"]

[tool.coverage.run]
branch = true
source = ["atlas"]

[tool.ruff.lint.flake8-bugbear]
# Depends() as a default value is FastAPI's normal form.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
