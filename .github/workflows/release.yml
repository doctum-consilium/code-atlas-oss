# Release: on a version tag (v1.2.3), build every deliverable in CI and publish a GitHub release
# with SHA-256 checksums. Nothing is built on a developer machine, so a release is reproducible.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (wheel + sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version matches the tag
        run: |
          v=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::backend/pyproject.toml says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - run: cd backend && uv build --out-dir ../dist
      - uses: actions/upload-artifact@v4
        with: { name: backend, path: dist/ }

  web:
    name: Web (static build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
      - run: mkdir -p dist && tar -C web/dist -czf "dist/code-atlas-web-${GITHUB_REF_NAME}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/ }

  desktop:
    name: Desktop (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.4, channel: stable, cache: true }
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libgtk-3-dev clang cmake pkg-config
      - run: cd desktop && flutter pub get && flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C desktop/build/linux/x64/release/bundle -czf "dist/code-atlas-desktop-linux-x64-${GITHUB_REF_NAME}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: dist/ }

  publish:
    name: Publish the release
    needs: [backend, web, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $v"; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "code-atlas $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
